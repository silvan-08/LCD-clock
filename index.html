<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LCD Clock</title>
<style>
:root{
  --page:#ececec; --case:#1b1b1b; --lcd:#c8cdbb; --ink:#1c1d14; --off:#b9bfad; --focus:#2f5fd0; --ctl:#333; --line:#9a9a9a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--page:#0f0f10; --case:#2a2a2c; --ctl:#d0d0d0; --line:#666;}
}
:root[data-theme="dark"]{--page:#0f0f10; --case:#2a2a2c; --ctl:#d0d0d0; --line:#666;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--page);display:flex;align-items:center;justify-content:center;font-family:"Helvetica Neue",Arial,sans-serif}
.wrap{width:min(94vw,560px);display:flex;flex-direction:column;align-items:center;gap:14px}
.case{width:100%;background:var(--case);border-radius:8% / 13%;padding:3.6%;box-shadow:0 14px 30px rgba(0,0,0,.22)}
.lcd{background:var(--lcd);border-radius:5% / 8%;padding:3% 5% 4.5%;color:var(--ink);box-shadow:inset 0 0 0 2px rgba(0,0,0,.22)}
.time{display:flex;align-items:baseline;justify-content:center;gap:3%;font-weight:800;line-height:1}
.hm{font-size:clamp(48px,14.5vw,96px);letter-spacing:-.02em}
.ss{font-size:clamp(24px,7.5vw,48px)}
.ap{font-size:clamp(13px,3.8vw,22px);align-self:flex-end;margin-bottom:.35em}
.flags{display:grid;grid-template-columns:repeat(4,1fr);gap:3%;margin-top:4%;text-align:center;font-weight:700;font-size:clamp(10px,3vw,16px)}
.flags button{all:unset;cursor:pointer;display:block;text-align:center;padding:2px 0}
.flags button:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.flags i{display:block;height:7px;border-radius:3px;margin-top:4px;background:var(--off)}
.flags button.on i{background:var(--ink)}
.scale{display:flex;justify-content:space-between;font-weight:600;font-size:clamp(10px,2.8vw,15px);margin:4.5% 0 4px}
.tens{display:grid;grid-template-columns:repeat(5,1fr);gap:2.5%}
.ones{display:grid;grid-template-columns:repeat(10,1fr);gap:1.8%}
.tens b,.ones b{height:clamp(16px,4.6vw,28px);border-radius:3px;background:var(--off)}
.tens b.on,.ones b.on{background:var(--ink)}
.lcd.flash{filter:invert(1)}
.info{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2.5%;font-weight:700;min-height:1.6em}
.info .date{font-size:clamp(10px,2.7vw,14px);letter-spacing:.04em;text-align:left}
.rt{display:flex;align-items:center;gap:10px;font-size:clamp(10px,2.7vw,14px)}
.bell{all:unset;cursor:pointer;display:flex;align-items:center;gap:4px}
.bell svg{width:1.25em;height:1.25em;fill:currentColor;opacity:.3}
.bell.on svg{opacity:1}
.mini{all:unset;cursor:pointer;text-align:center;padding:1px 2px}
.mini i{display:block;height:4px;border-radius:2px;margin-top:2px;background:var(--off)}
.mini.on i{background:var(--ink)}
.mini:focus-visible,.bell:focus-visible,.flags button:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.edit{display:flex;gap:5px;align-items:center;margin:0 auto;font-size:clamp(11px,3vw,15px)}
.edit select{font:inherit;padding:1px 2px;border:1px solid var(--ink);border-radius:4px;background:transparent;color:var(--ink)}
.edit button{font:inherit;font-size:.9em;padding:2px 8px;border:0;border-radius:4px;background:var(--ink);color:var(--lcd);cursor:pointer}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <main class="case" aria-label="Digital clock">
    <div class="lcd">
      <div class="time" role="timer"><span class="hm" id="hm">--:--</span><span class="ss" id="ss">--</span><span class="ap" id="ap"></span></div>
      <div class="info">
        <div class="date" id="date"></div>
        <div class="rt" id="rt">
          <button class="bell" id="bell" aria-label="Alarm"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a1.5 1.5 0 0 0-1.5 1.5v.7C7.9 5 6 7.3 6 10v4l-2 2.5V18h16v-1.5L18 14v-4c0-2.7-1.9-5-4.5-5.8v-.7A1.5 1.5 0 0 0 12 2zm-2 17a2 2 0 0 0 4 0z"/></svg><span id="alt"></span></button>
          <button class="mini" id="h24" aria-label="24 hour mode">24<i></i></button>
        </div>
        <div class="edit" id="edit" hidden><select id="eh" aria-label="Alarm hour"></select>:<select id="em" aria-label="Alarm minute"></select><select id="ep" aria-label="AM or PM"><option>AM</option><option>PM</option></select><button id="ok">OK</button></div>
      </div>
      <div class="flags" id="flags">
        <button id="alm">ALM<i></i></button><button id="sig" class="on">SIG<i></i></button><button id="mute">MUTE<i></i></button><button id="dst">DST<i></i></button>
      </div>
      <div class="scale"><span>10</span><span>20</span><span>30</span><span>40</span><span>50</span></div>
      <div class="tens" id="tens"></div>
      <div class="scale"><span>0</span><span>2</span><span>4</span><span>6</span><span>8</span><span>10</span></div>
      <div class="ones" id="ones"></div>
    </div>
  </main>
</div>
<script>
const tens=document.getElementById('tens'), ones=document.getElementById('ones');
for(let i=0;i<5;i++)tens.appendChild(document.createElement('b'));
for(let i=0;i<10;i++)ones.appendChild(document.createElement('b'));
const st={alm:false,sig:true,mute:false,dst:false};
let h12=true,almAt='07:00';
try{const v=localStorage.getItem('h12');if(v!==null)h12=v==='1';const t=localStorage.getItem('almAt');if(t)almAt=t;}catch(e){}
const $=id=>document.getElementById(id);
$('h24').addEventListener('click',()=>{
  h12=!h12;
  try{localStorage.setItem('h12',h12?'1':'0');}catch(e){}
  sync();tick();
});
let ctx=null,ringUntil=0,lastN=0,lastKey='';
const lcd=document.querySelector('.lcd');
function beep(f,dur){
  if(st.mute)return;
  try{
    ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.resume)ctx.resume();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.frequency.value=f;o.connect(g);g.connect(ctx.destination);
    g.gain.setValueAtTime(.15,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);
    o.start();o.stop(ctx.currentTime+dur);
  }catch(e){}
}
function almText(){
  const h=+almAt.slice(0,2),m=almAt.slice(3);
  return h12?((h%12||12)+':'+m+' '+(h<12?'AM':'PM')):almAt;
}
function sync(){
  for(const k in st)$(k).classList.toggle('on',st[k]);
  $('h24').classList.toggle('on',!h12);
  $('bell').classList.toggle('on',st.alm);
  $('alt').textContent=st.alm?almText():'';
}
function openEdit(){
  const h=+almAt.slice(0,2),m=+almAt.slice(3);
  const eh=$('eh'),em=$('em');
  eh.innerHTML='';em.innerHTML='';
  for(let i=h12?1:0;i<=(h12?12:23);i++)eh.add(new Option(p(i),i));
  for(let i=0;i<60;i++)em.add(new Option(p(i),i));
  eh.value=h12?(h%12||12):h;em.value=m;
  $('ep').value=h<12?'AM':'PM';$('ep').hidden=!h12;
  $('date').hidden=true;$('rt').hidden=true;$('edit').hidden=false;eh.focus();
}
function closeEdit(save){
  if(save){
    let h=+$('eh').value;
    if(h12)h=(h%12)+($('ep').value==='PM'?12:0);
    almAt=p(h)+':'+p(+$('em').value);st.alm=true;
    try{localStorage.setItem('almAt',almAt);}catch(e){}
  }
  $('edit').hidden=true;$('date').hidden=false;$('rt').hidden=false;sync();tick();
}
$('ok').addEventListener('click',()=>closeEdit(true));
$('edit').addEventListener('keydown',e=>{if(e.key==='Escape')closeEdit(false);});
let lastAlm=0;
function almClick(){
  const now=Date.now();
  if(ringUntil){ringUntil=0;st.alm=false;}
  else if(now-lastAlm<350){lastAlm=0;st.alm=!st.alm;sync();openEdit();return;}
  else st.alm=!st.alm;
  lastAlm=now;
  if(st.alm)beep(660,.15);
  sync();tick();
}
$('bell').addEventListener('click',almClick);
$('flags').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='alm'){almClick();return;}
  st[b.id]=!st[b.id];
  if(b.id==='sig'&&st.sig)beep(880,.15);
  sync();tick();
});
const p=n=>String(n).padStart(2,'0');
function check(d){
  const key=d.getHours()+':'+d.getMinutes();
  if(d.getSeconds()===0&&key!==lastKey){
    lastKey=key;
    if(st.alm&&almAt===p(d.getHours())+':'+p(d.getMinutes()))ringUntil=Date.now()+30000;
    else if(st.sig&&d.getMinutes()===0)beep(1000,.4);
  }
  if(ringUntil&&Date.now()<ringUntil){
    const n=Math.floor(Date.now()/500);
    if(n!==lastN){lastN=n;beep(1200,.2);}
    lcd.classList.toggle('flash',n%2===0);
  }else{ringUntil=0;lcd.classList.remove('flash');}
}
function tick(){
  const d=new Date(Date.now()+(st.dst?3600000:0)),s=d.getSeconds();
  check(d);
  const H=d.getHours();
  document.getElementById('hm').textContent=p(h12?(H%12||12):H)+':'+p(d.getMinutes());
  document.getElementById('ap').textContent=h12?(H<12?'AM':'PM'):'';
  document.getElementById('ss').textContent=p(s);
  $('date').textContent=p(d.getDate())+'-'+p(d.getMonth()+1)+' '+['SUN','MON','TUE','WED','THU','FRI','SAT'][d.getDay()];
  const t=Math.floor(s/10), o=s%10;
  [...tens.children].forEach((b,i)=>b.classList.toggle('on',i<t));
  [...ones.children].forEach((b,i)=>b.classList.toggle('on',i<o));
}
sync();tick();setInterval(tick,250);
</script>
</body>
</html>
